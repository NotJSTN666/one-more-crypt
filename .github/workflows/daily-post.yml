name: Daily X post

# Every morning at 7 AM Central: make the day's posts for @OneMoreCrypt (endless leader,
# yesterday's champion, today's crypt) and email them for posting by hand. Set the repo
# variable AUTO_POST to true to post them through the X API instead (needs X credits).
# Setup steps: docs/daily-x-post.md.
on:
  schedule:
    - cron: '0 12 * * *' # 7 AM CDT (summer)
    - cron: '0 13 * * *' # 7 AM CST (winter); the script skips whichever isn't 7 AM in Chicago
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do with the posts'
        type: choice
        options: [email, preview, post]
        default: email

permissions:
  contents: read

concurrency:
  group: daily-x-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Emoji font for the relic row
        run: sudo apt-get install -y fonts-noto-color-emoji
      - run: node scripts/daily-post.mjs
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (vars.AUTO_POST == 'true' && 'post' || 'email') }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POST_EMAIL_TO: ${{ secrets.POST_EMAIL_TO }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-preview
          path: out/
          if-no-files-found: ignore

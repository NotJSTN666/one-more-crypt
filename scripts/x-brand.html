<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Silkscreen&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #07040b; }
      canvas { display: block; margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <canvas id="avatar" width="800" height="800"></canvas>
    <canvas id="header" width="1500" height="500"></canvas>
    <canvas id="discord" width="960" height="540"></canvas>
    <canvas id="itch" width="630" height="500"></canvas>
    <script type="module">
      // Profile picture and cover images for X, Discord, itch.io and Instagram.
      // Regenerate with: node scripts/make-x-brand.mjs
      import { HEROES } from '/src/content.ts';
      import { drawAura } from '/src/aura.ts';
      import { heroSprite } from '/src/hero.ts';
      import { enemyFrames, sprites } from '/src/sprites.ts';
      await document.fonts.load('120px "Pirata One"');
      await document.fonts.load('28px Silkscreen');
      const s = sprites();
      const foe = (kind) => enemyFrames(kind).idle[0].normal;
      const knight = heroSprite('knight', { crown: 1, ember: 2, mirror: 1, fang: 1 }, ['fang', 'mirror', 'ember', 'crown']).normal;

      /** A seeded random, so the art comes out the same every time. */
      const rng = (seed) => () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);

      /** Dark stone flagstones with a lit top edge. */
      function floor(ctx, x0, y0, w, h, t) {
        for (let x = x0; x < x0 + w; x += t) {
          for (let y = y0; y < y0 + h; y += t) {
            ctx.fillStyle = (Math.round(x / t) + Math.round(y / t)) % 2 ? '#1d1824' : '#221c2b';
            ctx.fillRect(x, y, t, t);
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillRect(x, y, t, t / 16);
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(x, y + t - t / 16, t, t / 16);
            ctx.fillRect(x + t - t / 16, y, t / 16, t);
          }
        }
      }

      function embers(ctx, x0, w, h, n, seed, green = 0) {
        const r = rng(seed);
        for (let i = 0; i < n; i++) {
          const size = r() < 0.3 ? 6 : 4;
          const g = r() < green;
          ctx.fillStyle = g ? 'rgba(155,227,106,0.7)' : r() < 0.5 ? 'rgba(255,138,42,0.8)' : 'rgba(242,193,78,0.6)';
          ctx.fillRect(x0 + Math.floor(r() * w), Math.floor(r() * h), size, size);
        }
      }

      /** Plague mist: soft green banks low across the ground. */
      function mist(ctx, x0, x1, y, h, seed, a = 0.22) {
        const r = rng(seed);
        for (let i = 0; i < 14; i++) {
          const x = x0 + r() * (x1 - x0);
          const yy = y + r() * h;
          const rad = 60 + r() * 90;
          const g = ctx.createRadialGradient(x, yy, 0, x, yy, rad);
          g.addColorStop(0, `rgba(130, 200, 90, ${a})`);
          g.addColorStop(1, 'rgba(130, 200, 90, 0)');
          ctx.fillStyle = g;
          ctx.fillRect(x - rad, yy - rad, rad * 2, rad * 2);
        }
      }

      function glow(ctx, x, y, r, color) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, color);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }

      function vignette(ctx, w, h, cx, cy, inner, outer, a) {
        const v = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
        v.addColorStop(0, 'rgba(0,0,0,0)');
        v.addColorStop(1, `rgba(0,0,0,${a})`);
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, w, h);
      }

      /** A sprite with a soft shadow at its feet and an optional glow. */
      function figure(ctx, img, x, y, size, shadow, flip = false) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.ellipse(x + size / 2, y + size * 0.97, size * 0.32, size * 0.07, 0, 0, Math.PI * 2);
        ctx.fill();
        if (shadow) {
          ctx.shadowColor = shadow;
          ctx.shadowBlur = size * 0.25;
        }
        ctx.save();
        if (flip) {
          ctx.translate(x + size, y);
          ctx.scale(-1, 1);
          ctx.drawImage(img, 0, 0, size, size);
        } else ctx.drawImage(img, x, y, size, size);
        ctx.restore();
        ctx.shadowBlur = 0;
      }

      function title(ctx, x, y, size, sub, subY, sub2, sub2Y, subSize) {
        ctx.textAlign = 'center';
        ctx.font = `${size}px "Pirata One"`;
        ctx.shadowColor = 'rgba(210,58,70,0.75)';
        ctx.shadowBlur = size * 0.3;
        ctx.fillStyle = '#d23a46';
        ctx.fillText('One More Crypt', x, y);
        ctx.shadowBlur = 0;
        ctx.font = `${subSize}px Silkscreen`;
        if (sub) {
          ctx.fillStyle = '#e8dcc4';
          ctx.fillText(sub, x, subY);
        }
        if (sub2) {
          ctx.fillStyle = '#f2c14e';
          ctx.fillText(sub2, x, sub2Y);
        }
      }

      /** Four little mode tags in a row. */
      function modes(ctx, cx, y, size, gap) {
        const list = [['DAILY', '#d23a46'], ['ENDLESS', '#b07cff'], ['HORDE', '#ff8a2a'], ['STORY', '#5fe3ff']];
        ctx.font = `${size}px Silkscreen`;
        const widths = list.map(([n]) => ctx.measureText(n).width + size * 1.6);
        let x = cx - (widths.reduce((a, b) => a + b, 0) + gap * (list.length - 1)) / 2;
        ctx.textAlign = 'center';
        list.forEach(([n, c], i) => {
          const w = widths[i];
          const h = size * 2;
          ctx.fillStyle = 'rgba(16,10,22,0.85)';
          ctx.fillRect(x, y, w, h);
          ctx.strokeStyle = c;
          ctx.lineWidth = Math.max(2, size / 9);
          ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
          ctx.fillStyle = c;
          ctx.fillText(n, x + w / 2, y + h * 0.68);
          x += w + gap;
        });
      }

      // ---------- the pixel scene kit ----------
      // Scenes are painted on a small canvas, one pixel per grid cell, then blown up without
      // smoothing so the stone, torches and heroes share one crisp pixel look. Light and text
      // go on top at full size.

      /** A small canvas to paint a scene on. */
      function grid(w, h) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const g = c.getContext('2d');
        g.imageSmoothingEnabled = false;
        const px = (x, y, w2, h2, col) => { g.fillStyle = col; g.fillRect(x, y, w2, h2); };
        return { c, g, px };
      }

      /** Dungeon bricks: staggered, each a slightly different stone, with dark mortar and a lit top. */
      function bricks(px, x0, y0, w, h, seed, tones = ['#231d2c', '#272030', '#2b2335', '#201a28']) {
        const r = rng(seed);
        px(x0, y0, w, h, '#0e0a13');
        for (let y = y0, row = 0; y < y0 + h; y += 5, row++) {
          for (let x = x0 - (row % 2 ? 4 : 0); x < x0 + w; x += 9) {
            const bx = Math.max(x, x0);
            const bw = Math.min(x + 8, x0 + w) - bx;
            if (bw <= 0) continue;
            px(bx, y, bw, 4, tones[Math.floor(r() * tones.length)]);
            px(bx, y, bw, 1, 'rgba(255,255,255,0.05)');
            if (r() < 0.12) px(bx + Math.floor(r() * bw), y + 1 + Math.floor(r() * 2), 1, 1, '#120d18');
          }
        }
      }

      /** Flagstones receding a little: big slabs with lit edges and the odd crack or bone. */
      function flags(px, x0, y0, w, h, seed) {
        const r = rng(seed);
        px(x0, y0, w, h, '#15111b');
        for (let y = y0, row = 0; y < y0 + h; y += 7 + row, row++) {
          for (let x = x0 - (row % 2 ? 6 : 0); x < x0 + w; x += 13) {
            px(x, y, 12, 6 + row, r() < 0.5 ? '#1f1a27' : '#231d2c');
            px(x, y, 12, 1, '#2f2839');
            if (r() < 0.15) px(x + 3 + Math.floor(r() * 6), y + 2, 2, 1, '#cfc6b0');
          }
        }
        px(x0, y0, w, 1, '#3a3146');
      }

      /** A wall torch: iron bracket, a cup, and a flickering flame. */
      function torch(px, x, y) {
        px(x, y + 4, 3, 1, '#4a4152');
        px(x + 1, y + 3, 1, 4, '#3a3242');
        px(x - 1, y + 2, 5, 2, '#5a4030');
        px(x, y - 2, 3, 4, '#ff8a2a');
        px(x + 1, y - 4, 1, 3, '#ffd23f');
        px(x, y - 1, 1, 1, '#ffd23f');
        px(x + 1, y - 5, 1, 1, '#fff2c0');
        px(x - 1, y - 1, 1, 2, '#d23a46');
        px(x + 3, y - 2, 1, 2, '#d23a46');
      }

      /** A hanging banner: red cloth with a gold edge and a bell, cut to a swallowtail. */
      function banner(px, x, y, w, h) {
        px(x - 1, y, w + 2, 1, '#5a4030');
        px(x, y + 1, w, h, '#8a1f2c');
        px(x, y + 1, 1, h, '#c9a24a');
        px(x + w - 1, y + 1, 1, h, '#c9a24a');
        px(x + 1, y + 1, w - 2, 1, '#a5293a');
        for (let i = 0; i < w / 2; i++) px(x + Math.floor(w / 2) - i - 1, y + h + 1 + Math.floor(i / 1) - (w / 2 - 1), 1, 1, 'rgba(0,0,0,0)');
        const cx = x + Math.floor(w / 2);
        px(cx - 1, y + 4, 2, 1, '#f2c14e');
        px(cx - 2, y + 5, 4, 3, '#f2c14e');
        px(cx - 3, y + 8, 6, 1, '#f2c14e');
        px(cx, y + 9, 1, 1, '#f2c14e');
        // the swallowtail
        px(x, y + h + 1, Math.floor(w / 2) - 1, 2, '#8a1f2c');
        px(x + Math.ceil(w / 2) + 1, y + h + 1, Math.floor(w / 2) - 1, 2, '#8a1f2c');
        px(x, y + h + 1, 1, 2, '#c9a24a');
        px(x + w - 1, y + h + 1, 1, 2, '#c9a24a');
      }

      /** A hanging chain. */
      function chain(px, x, y, len) {
        for (let i = 0; i < len; i++) px(x + (i % 2), y + i, 1, 1, i % 2 ? '#3a3242' : '#4f4658');
      }

      /** Soft light added on top of a finished scene. */
      function light(ctx, x, y, r, color, a) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, color.replace('A', a));
        g.addColorStop(1, color.replace('A', 0));
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
        ctx.restore();
      }

      /** A sprite in one flat colour, for outlines and rim light. */
      function silhouette(img, color) {
        const c = document.createElement('canvas');
        c.width = img.width;
        c.height = img.height;
        const g = c.getContext('2d');
        g.drawImage(img, 0, 0);
        g.globalCompositeOperation = 'source-in';
        g.fillStyle = color;
        g.fillRect(0, 0, c.width, c.height);
        return c;
      }

      /**
       * A hero or foe standing on the floor: a shadow, its aura behind, a one-pixel coloured
       * outline so it reads at any size, the sprite, then the aura in front.
       */
      function stand(ctx, img, x, feet, size, opts = {}) {
        const { aura, glow: halo, flip, t = 0.6, alpha = 1, shade } = opts;
        const cx = x + size / 2;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(cx, feet - size * 0.02, size * 0.34, size * 0.07, 0, 0, Math.PI * 2);
        ctx.fill();
        if (aura) drawAura(ctx, aura, cx, feet, size, t, 'back');
        ctx.globalAlpha = alpha;
        const top = feet - size;
        const draw = (im, dx = 0, dy = 0) => {
          ctx.save();
          if (flip) {
            ctx.translate(x + size + dx, top + dy);
            ctx.scale(-1, 1);
            ctx.drawImage(im, 0, 0, size, size);
          } else ctx.drawImage(im, x + dx, top + dy, size, size);
          ctx.restore();
        };
        if (halo) {
          ctx.shadowColor = halo;
          ctx.shadowBlur = size * 0.22;
        }
        draw(img);
        ctx.shadowBlur = 0;
        // Something far back: its colours sunk into the shadow, but its eyes still showing.
        if (shade) draw(silhouette(img, shade));
        if (aura) drawAura(ctx, aura, cx, feet, size, t, 'front');
        ctx.restore();
      }

      /** The title in the game's blackletter: a dark outline, a red glow, and a lighter top. */
      function bigTitle(ctx, x, y, size) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = `${size}px "Pirata One"`;
        ctx.lineJoin = 'round';
        ctx.lineWidth = size * 0.1;
        ctx.strokeStyle = '#120509';
        ctx.strokeText('One More Crypt', x, y);
        ctx.shadowColor = 'rgba(255,60,80,0.8)';
        ctx.shadowBlur = size * 0.35;
        const g = ctx.createLinearGradient(0, y - size * 0.75, 0, y);
        g.addColorStop(0, '#ff6b78');
        g.addColorStop(0.55, '#d23a46');
        g.addColorStop(1, '#8a1f2c');
        ctx.fillStyle = g;
        ctx.fillText('One More Crypt', x, y);
        ctx.restore();
      }

      function caption(ctx, text, x, y, size, color) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = `${size}px Silkscreen`;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillText(text, x + size * 0.12, y + size * 0.12);
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      /** A thin gold rule with a diamond in the middle. */
      function flourish(ctx, cx, y, half) {
        ctx.save();
        const g = ctx.createLinearGradient(cx - half, 0, cx + half, 0);
        g.addColorStop(0, 'rgba(201,162,74,0)');
        g.addColorStop(0.5, 'rgba(242,193,78,0.9)');
        g.addColorStop(1, 'rgba(201,162,74,0)');
        ctx.fillStyle = g;
        ctx.fillRect(cx - half, y, half * 2, 3);
        ctx.fillStyle = '#f2c14e';
        ctx.translate(cx, y + 1.5);
        ctx.rotate(Math.PI / 4);
        ctx.fillRect(-6, -6, 12, 12);
        ctx.restore();
      }

      /**
       * A pointed arch opening onto stairs that glow crimson far below: centred on cx, the
       * curve springing at `spring` with half-width R, open down to `bottom`, brightest at glowY.
       */
      function archway(px, cx, spring, R, bottom, glowY) {
        const inside = (x, y, grow = 0) => y >= spring ? Math.abs(x + 0.5 - cx) <= R + grow : Math.hypot(x + 0.5 - (cx - R), y - spring) <= 2 * R + grow && Math.hypot(x + 0.5 - (cx + R), y - spring) <= 2 * R + grow;
        const top = Math.floor(spring - Math.sqrt(3) * R) - 5;
        for (let y = Math.max(0, top); y < bottom; y++) {
          for (let x = cx - R - 5; x <= cx + R + 5; x++) {
            if (inside(x, y)) {
              // the depths: black at the top of the arch, glowing crimson far down the stairs
              const d = Math.hypot((x - cx) / 1.6, y - glowY);
              const t = Math.max(0, 1 - d / (R * 1.35));
              const r = Math.round(14 + 150 * t * t), gg = Math.round(6 + 22 * t * t), b = Math.round(18 + 30 * t * t);
              px(x, y, 1, 1, `rgb(${r},${gg},${b})`);
            } else if (inside(x, y, 4)) {
              // the arch stones, lit along their inner edge
              const edge = inside(x, y, 1);
              const seg = Math.floor(Math.atan2(y - spring, x - cx) * 6 + (y >= spring ? y / 4 : 0));
              px(x, y, 1, 1, edge ? '#5d5268' : seg % 2 ? '#3d3448' : '#463c52');
            }
          }
        }
        // stairs going down: each step narrower and dimmer toward the glow
        for (let i = 0; i < 7; i++) {
          const y = bottom - 2 - i * 3;
          const hw = Math.round((R - 2) * (1 - i / 8));
          px(cx - hw, y, hw * 2, 1, i < 2 ? '#4a2a36' : '#5a1f2c');
          px(cx - hw, y + 1, hw * 2, 2, i < 2 ? '#1c1220' : '#2a0e18');
        }
      }

      const reaper = s.reaper.normal;
      // The heroes dressed in the crypt's finest, each with an aura.
      const cast = [
        { id: 'rogue', look: 'void', head: '', aura: 'abyssal' },
        { id: 'necro', look: 'lich', head: 'lichdiadem', aura: 'lichfire' },
        { id: 'ranger', look: 'moss', head: 'raven', aura: 'spectralvigil' },
        { id: 'knight', look: '', head: '', aura: '', lead: true },
        { id: 'paladin', look: 'bone', head: 'bellcrown', aura: 'belltoll' },
        { id: 'mage', look: 'royal', head: 'candles', aura: 'stormcharged' },
        { id: 'barbarian', look: 'ember', head: 'ironhorns', aura: 'emberheart' },
      ];
      // The crowned knight keeps the classic look: the game's own icon.
      const heroImg = (h) => (h.lead ? knight : heroSprite(h.id, {}, [], h.look, h.head).normal);

      // ---------- profile picture (800x800, safe inside a circle) ----------
      {
        const ctx = document.getElementById('avatar').getContext('2d');
        ctx.imageSmoothingEnabled = false;
        const S = 10;
        const { c, px } = grid(80, 80);
        bricks(px, 0, 0, 80, 80, 4);
        archway(px, 40, 34, 19, 72, 44);
        // the keystone, carved with the bell
        px(36, 11, 8, 9, '#4f4559');
        px(36, 11, 8, 1, '#6b6078');
        px(39, 13, 2, 1, '#c9a24a');
        px(38, 14, 4, 3, '#c9a24a');
        px(37, 17, 6, 1, '#f2c14e');
        px(39, 18, 2, 1, '#c9a24a');
        // torches either side
        torch(px, 9, 36);
        torch(px, 68, 36);
        chain(px, 4, 0, 18);
        chain(px, 75, 0, 22);
        flags(px, 0, 72, 80, 8, 2);
        ctx.drawImage(c, 0, 0, 800, 800);
        // light: torch glow, the crimson breath of the crypt, a green mist low on the threshold
        light(ctx, 105, 340, 170, 'rgba(255,150,60,A)', 0.42);
        light(ctx, 695, 340, 170, 'rgba(255,150,60,A)', 0.42);
        light(ctx, 400, 470, 300, 'rgba(210,40,60,A)', 0.3);
        const band = ctx.createLinearGradient(0, 640, 0, 800);
        band.addColorStop(0, 'rgba(130, 200, 90, 0)');
        band.addColorStop(0.5, 'rgba(130, 200, 90, 0.13)');
        band.addColorStop(1, 'rgba(130, 200, 90, 0)');
        ctx.fillStyle = band;
        ctx.fillRect(0, 640, 800, 160);
        // the hero, crowned and dressed in gold, with gilded radiance behind
        const lead = cast.find((h) => h.lead);
        stand(ctx, heroImg(lead), 220, 740, 360, { glow: 'rgba(255,60,80,0.95)' });
        embers(ctx, 180, 440, 640, 26, 7, 0.25);
        vignette(ctx, 800, 800, 400, 430, 250, 580, 0.88);
      }

      // ---------- X header (1500x500; X puts the profile picture over the bottom-left) ----------
      {
        const ctx = document.getElementById('header').getContext('2d');
        ctx.imageSmoothingEnabled = false;
        const { c, px } = grid(375, 125);
        bricks(px, 0, 0, 375, 125, 9);
        // pillars with alcoves between them, a candle in each
        for (let x = 6; x < 375; x += 46) {
          px(x, 0, 7, 100, '#2f2838');
          px(x, 0, 1, 100, '#40374b');
          px(x + 6, 0, 1, 100, '#16111c');
          px(x - 1, 12, 9, 2, '#3a3245');
        }
        for (let x = 19; x < 375; x += 46) {
          px(x, 30, 20, 26, '#0b0710');
          for (let i = 0; i < 6; i++) px(x + i, 30 - Math.floor((6 - i) / 2), 20 - i * 2, 1, '#0b0710');
          px(x + 9, 49, 2, 5, '#e8dcc4');
          px(x + 9, 47, 1, 2, '#ffd23f');
          px(x + 4, 53, 3, 3, '#d8cfb8');
          px(x + 4, 54, 1, 1, '#1a1420');
          px(x + 6, 54, 1, 1, '#1a1420');
        }
        banner(px, 100, 0, 12, 34);
        banner(px, 318, 0, 12, 34);
        chain(px, 70, 0, 26);
        chain(px, 236, 0, 20);
        torch(px, 98, 40);
        torch(px, 190, 40);
        torch(px, 282, 40);
        flags(px, 0, 100, 375, 25, 3);
        ctx.drawImage(c, 0, 0, 1500, 500);
        for (const x of [394, 762, 1130]) light(ctx, x, 170, 190, 'rgba(255,150,60,A)', 0.32);
        light(ctx, 1320, 330, 300, 'rgba(120,200,80,A)', 0.2);
        light(ctx, 1380, 200, 240, 'rgba(150,90,255,A)', 0.16);
        mist(ctx, 980, 1500, 340, 130, 9, 0.18);
        // Death looms at the back, half in shadow
        stand(ctx, reaper, 1150, 470, 290, { flip: true, shade: 'rgba(14,6,24,0.72)' });
        light(ctx, 1290, 250, 120, 'rgba(176,124,255,A)', 0.18);
        // the foes: the dead, a plague monk, a wraith and the Plague Abbot
        stand(ctx, foe('ghoul'), 905, 452, 88, { flip: true });
        stand(ctx, foe('monk'), 985, 446, 96, { flip: true });
        stand(ctx, foe('wraith'), 1075, 430, 96, { flip: true });
        stand(ctx, foe('bat'), 1384, 170, 64, { flip: true });
        stand(ctx, foe('abbot'), 1310, 472, 170, { flip: true, glow: 'rgba(155,227,106,0.7)' });
        // the heroes, the crowned knight out front
        cast.forEach((h, i) => {
          const lead = h.lead;
          const x = 300 + i * 74 + (lead ? 0 : 0);
          stand(ctx, heroImg(h), x, lead ? 474 : 448 + (i % 2) * 14, lead ? 120 : 96, { aura: h.aura, glow: lead ? 'rgba(255,60,80,0.9)' : null, t: 0.4 + i * 0.37 });
        });
        embers(ctx, 0, 1500, 380, 50, 3, 0.25);
        vignette(ctx, 1500, 500, 880, 230, 300, 950, 0.7);
        bigTitle(ctx, 880, 142, 126);

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Silkscreen&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #07040b; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="card" width="1200" height="675"></canvas>
    <script type="module">
      // Images for the daily X posts (scripts/daily-post.mjs drives this page).
      import { drawChampion, drawDaily, fontsReady, today } from '/scripts/cards.ts';

      await fontsReady();
      const card = document.getElementById('card');
      window.today = today;
      window.renderChampion = (d) => drawChampion(card, d);
      window.renderDaily = (d) => drawDaily(card, d);
      window.ready = true;
    </script>
  </body>
</html>

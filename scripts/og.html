<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Silkscreen&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #07040b; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1200" height="630"></canvas>
    <script type="module">
      // Social preview card, all about the Daily Crypt: what it is (one crypt a day, the same for
      // everyone, one try) beside a real board from today's daily, drawn by the game's own
      // renderer. Regenerate with: node scripts/make-og.mjs
      import { Game } from '/src/game.ts';
      import { Renderer } from '/src/render.ts';
      import { dailyNumber } from '/src/daily.ts';
      import { hashSeed } from '/src/rng.ts';
      import { runConfig } from '/src/meta.ts';
      await document.fonts.load('120px "Pirata One"');
      await document.fonts.load('28px Silkscreen');
      const c = document.getElementById('c');
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      // background: a deep red glow behind the words, faint stone along the bottom
      const bg = ctx.createRadialGradient(330, 230, 40, 520, 315, 900);
      bg.addColorStop(0, '#2c1220');
      bg.addColorStop(1, '#07040b');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1200, 630);
      for (let x = 0; x < 1200; x += 48) {
        for (let y = 486; y < 630; y += 48) {
          ctx.fillStyle = (x / 48 + y / 48) % 2 ? 'rgba(40,32,52,0.5)' : 'rgba(33,27,41,0.5)';
          ctx.fillRect(x, y, 48, 48);
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.fillRect(x, y + 45, 48, 3);
          ctx.fillRect(x + 45, y, 3, 48);
        }
      }

      // today's daily crypt, first floor, as everyone sees it
      const n = dailyNumber();
      const board = document.createElement('canvas');
      const r = new Renderer(board, true);
      r.resize(560);
      const g = new Game('daily', hashSeed('cryptfall-daily', n), n, runConfig('daily', n));
      r.setGame(g);
      r.consume(g.events.splice(0));
      for (let i = 0; i < 160; i++) r.frame(1 / 60);
      const B = 492;
      const bx = 668;
      const by = 52;
      ctx.shadowColor = 'rgba(242, 193, 78, 0.4)';
      ctx.shadowBlur = 40;
      ctx.fillStyle = '#100a16';
      ctx.fillRect(bx - 10, by - 10, B + 20, B + 20);
      ctx.shadowBlur = 0;
      // (a touch brighter than in play, so it reads in a small preview)
      ctx.filter = 'brightness(1.35) saturate(1.1)';
      ctx.drawImage(board, bx, by, B, B);
      ctx.filter = 'none';
      ctx.strokeStyle = '#5a5070';
      ctx.lineWidth = 4;
      ctx.strokeRect(bx - 8, by - 8, B + 16, B + 16);
      ctx.strokeStyle = '#c9a24a';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx - 3, by - 3, B + 6, B + 6);
      ctx.font = '18px Silkscreen';
      ctx.textAlign = 'center';
      const tag = "TODAY'S CRYPT · SAME FOR EVERYONE";
      const tw = ctx.measureText(tag).width + 28;
      ctx.fillStyle = '#241a08';
      ctx.fillRect(bx + B / 2 - tw / 2, by + B - 4, tw, 34);
      ctx.strokeStyle = '#f2c14e';
      ctx.strokeRect(bx + B / 2 - tw / 2, by + B - 4, tw, 34);
      ctx.fillStyle = '#f2c14e';
      ctx.fillText(tag, bx + B / 2, by + B + 19);

      // the words
      const cx = 330;
      ctx.font = '46px "Pirata One"';
      ctx.shadowColor = 'rgba(210,58,70,0.75)';
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#d23a46';
      ctx.fillText('One More Crypt', cx, 92);
      ctx.font = '112px "Pirata One"';
      ctx.shadowColor = 'rgba(242,193,78,0.55)';
      ctx.shadowBlur = 34;
      ctx.fillStyle = '#f2c14e';
      ctx.fillText('The Daily Crypt', cx, 196);
      ctx.shadowBlur = 0;
      ctx.font = '23px Silkscreen';
      ctx.fillStyle = '#e8dcc4';
      ctx.fillText('ONE CRYPT A DAY.', cx, 252);
      ctx.fillText('THE SAME FOR EVERYONE.', cx, 284);
      ctx.fillStyle = '#ff6b78';
      ctx.fillText('YOU GET ONE TRY.', cx, 316);

      // three facts, as chips
      const facts = [['NEW AT MIDNIGHT', '#b07cff'], ['ONE ATTEMPT', '#d23a46'], ['ONE LEADERBOARD', '#5fe3ff']];
      ctx.font = '15px Silkscreen';
      const w = 196;
      facts.forEach(([name, col], i) => {
        const x = cx - (w * 3 + 24) / 2 + i * (w + 12);
        const y = 350;
        ctx.fillStyle = 'rgba(16, 10, 22, 0.85)';
        ctx.fillRect(x, y, w, 42);
        ctx.fillStyle = col;
        ctx.fillRect(x, y, 5, 42);
        ctx.strokeStyle = col;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, w - 2, 40);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#e8dcc4';
        ctx.fillText(name, x + w / 2 + 3, y + 27);
      });

      // the call
      ctx.font = '22px Silkscreen';
      const call = "▶  PLAY TODAY'S CRYPT";
      const cw = ctx.measureText(call).width + 48;
      ctx.fillStyle = '#d23a46';
      ctx.fillRect(cx - cw / 2, 420, cw, 54);
      ctx.fillStyle = '#7a1220';
      ctx.fillRect(cx - cw / 2, 470, cw, 4);
      ctx.fillStyle = '#fff6e0';
      ctx.fillText(call, cx, 455);

      // footer
      ctx.font = '21px Silkscreen';
      ctx.fillStyle = '#f2c14e';
      ctx.fillText('FREE · PLAYS IN YOUR BROWSER', cx, 572);
      ctx.fillStyle = '#e8dcc4';
      ctx.fillText('ONEMORECRYPT.COM', cx, 604);
      window.ogReady = true;
    </script>
  </body>
</html>

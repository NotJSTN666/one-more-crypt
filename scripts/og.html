<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Silkscreen&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #07040b; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1200" height="630"></canvas>
    <script type="module">
      // Social preview card. Regenerate with: node scripts/make-og.mjs
      import { sprites } from '/src/sprites.ts';
      await document.fonts.load('120px "Pirata One"');
      await document.fonts.load('28px Silkscreen');
      const c = document.getElementById('c');
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      const bg = ctx.createRadialGradient(600, 260, 40, 600, 315, 700);
      bg.addColorStop(0, '#2a1328');
      bg.addColorStop(1, '#07040b');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1200, 630);

      // floor tiles across the bottom
      for (let x = 0; x < 1200; x += 64) {
        for (let y = 430; y < 630; y += 64) {
          ctx.fillStyle = (x / 64 + y / 64) % 2 ? '#1d1824' : '#211b29';
          ctx.fillRect(x, y, 64, 64);
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.fillRect(x, y + 60, 64, 4);
          ctx.fillRect(x + 60, y, 4, 64);
        }
      }
      const s = sprites();
      const draw = (name, x, y, scale) => ctx.drawImage(s[name].normal, x, y, 12 * scale, 12 * scale);
      draw('player', 540, 380, 10);
      draw('ghoul', 300, 420, 8);
      draw('archer', 150, 410, 8);
      draw('bat', 380, 330, 6);
      draw('brute', 760, 400, 9);
      draw('wraith', 950, 410, 8);
      draw('bat', 860, 320, 5);

      // torch light vignette
      const v = ctx.createRadialGradient(600, 420, 120, 600, 380, 750);
      v.addColorStop(0, 'rgba(0,0,0,0)');
      v.addColorStop(1, 'rgba(0,0,0,0.75)');
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, 1200, 630);

      ctx.textAlign = 'center';
      ctx.font = '170px "Pirata One"';
      ctx.shadowColor = 'rgba(210,58,70,0.7)';
      ctx.shadowBlur = 40;
      ctx.fillStyle = '#d23a46';
      ctx.fillText('Wardenfall', 600, 190);
      ctx.shadowBlur = 0;
      ctx.font = '30px Silkscreen';
      ctx.fillStyle = '#e8dcc4';
      ctx.fillText('ONE CRYPT. ONE TRY A DAY.', 600, 255);
      ctx.fillStyle = '#f2c14e';
      ctx.fillText('HOW DEEP CAN YOU GO?', 600, 300);
      window.ogReady = true;
    </script>
  </body>
</html>

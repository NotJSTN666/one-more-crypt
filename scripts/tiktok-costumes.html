<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Silkscreen&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #000; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1080" height="1920"></canvas>
    <script type="module">
      // TikTok: "sorry I'm late, my hero was trying on Halloween costumes". The hero stands on
      // a bed, looks about, then the costumes change on the beat (the cuts land where the
      // trend's sound hits: 4.0, 5.73, 7.43, 9.37 and 11.23 s), ending on the title.
      // Rendered frame by frame by scripts/make-tiktok-costumes.mjs.
      import { drawAura } from '/src/aura.ts';
      import { heroSprite } from '/src/hero.ts';
      await document.fonts.load('120px "Pirata One"');
      await document.fonts.load('28px Silkscreen');
      await document.fonts.load('600 54px Inter');

      const FPS = 30;
      const LENGTH = 15.2;
      const c = document.getElementById('c');
      const ctx = c.getContext('2d');

      // What the hero wears, and when. Each look also nudges the pose so the cuts feel alive.
      const LOOKS = [
        { at: 0, look: '', head: '', aura: '', flip: false, dx: 0, dy: 0, scale: 56 },
        { at: 4.0, look: 'pumpkincloak', head: 'pumpkin', aura: 'hallowedwisps', flip: false, dx: 0, dy: 0, scale: 60 },
        { at: 5.733, look: 'witchcloak', head: 'witchhat', aura: 'plaguecenser', flip: true, dx: -60, dy: 0, scale: 56 },
        { at: 7.433, look: 'ghostlight', head: 'ghostsheet', aura: '', flip: false, dx: 40, dy: -60, scale: 56, ghost: true },
        { at: 9.367, look: 'plaguecoat', head: 'physicianmask', aura: 'vespercandles', flip: true, dx: 0, dy: 0, scale: 60 },
        { at: 11.233, look: 'shadow', head: 'deathshood', aura: 'deathsshadow', flip: false, dx: 0, dy: 0, scale: 62, dark: true },
      ];
      const END = 13.6;

      const rng = (seed) => () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);

      // ---------- the room, drawn at 108x192 and blown up 10x ----------
      const room = document.createElement('canvas');
      room.width = 108;
      room.height = 192;
      const r = room.getContext('2d');
      const px = (x, y, w, h, col) => { r.fillStyle = col; r.fillRect(x, y, w, h); };
      function drawRoom(t, dark) {
        // stone wall
        px(0, 0, 108, 150, '#1f1a28');
        const rand = rng(5);
        for (let y = 0; y < 150; y += 6) {
          const off = (y / 6) % 2 ? 0 : 6;
          for (let x = -off; x < 108; x += 12) {
            px(x, y, 11, 5, rand() < 0.5 ? '#26202f' : '#2a2334');
            px(x, y, 11, 1, '#302839');
          }
        }
        // a window on the night, with the moon
        px(10, 18, 26, 32, '#3a2818');
        px(12, 20, 22, 28, '#0d1a2a');
        px(26, 23, 5, 5, '#e8e2c8');
        px(27, 23, 2, 1, '#fffbe8');
        for (const [sx, sy] of [[15, 25], [19, 31], [30, 37], [16, 41], [24, 43]]) px(sx, sy, 1, 1, Math.sin(t * 3 + sx) > 0 ? '#c9d8ff' : '#6b7aa0');
        px(22, 20, 2, 28, '#3a2818');
        px(12, 33, 22, 2, '#3a2818');
        px(9, 50, 28, 2, '#5a4030');
        // bunting along the top
        for (let i = 0; i < 9; i++) {
          const x = 4 + i * 12;
          const col = i % 2 ? '#7a34b0' : '#e67e22';
          px(x, 7, 6, 2, col);
          px(x + 1, 9, 4, 2, col);
          px(x + 2, 11, 2, 1, col);
        }
        px(0, 6, 108, 1, '#5a4030');
        // a cobweb in the corner, and its spider
        r.strokeStyle = 'rgba(220,220,230,0.35)';
        r.lineWidth = 0.5;
        r.beginPath();
        for (const a of [0, 0.4, 0.8, 1.2, 1.57]) { r.moveTo(108, 0); r.lineTo(108 - Math.cos(a) * 22, Math.sin(a) * 22); }
        for (const d of [7, 13, 19]) { r.moveTo(108 - d, 0); r.quadraticCurveTo(108 - d * 0.75, d * 0.75, 108, d); }
        r.stroke();
        const sy = 18 + Math.sin(t * 1.3) * 3;
        px(99, 0, 1, sy, 'rgba(220,220,230,0.4)');
        px(98, sy, 3, 2, '#141119');
        // a candle shelf, flickering
        px(72, 58, 26, 2, '#5a4030');
        for (const [cx, h] of [[76, 7], [84, 5], [92, 8]]) {
          px(cx, 58 - h, 3, h, '#e8dcc4');
          px(cx + 1, 57 - h - (Math.sin(t * 12 + cx) > 0 ? 2 : 1), 1, 2, '#ffd23f');
        }
        // the bed: headboard, mattress, a purple blanket and a pillow
        px(14, 92, 80, 40, '#3a2818');
        px(16, 94, 76, 36, '#4a3220');
        for (let x = 20; x < 90; x += 12) px(x, 96, 2, 32, '#3a2818');
        px(10, 88, 6, 62, '#2e1f12');
        px(92, 88, 6, 62, '#2e1f12');
        px(9, 86, 8, 3, '#5a4030');
        px(91, 86, 8, 3, '#5a4030');
        px(12, 128, 84, 10, '#d8d2c2');
        px(12, 134, 84, 12, '#3b2a4f');
        px(12, 134, 84, 2, '#4f3a66');
        for (let x = 16; x < 96; x += 10) px(x, 138, 4, 1, '#2a1f3a');
        px(18, 122, 22, 8, '#e8e2d6');
        px(18, 122, 22, 2, '#f6f2ea');
        px(12, 146, 84, 4, '#1a1420');
        // floorboards
        for (let y = 150; y < 192; y += 6) {
          px(0, y, 108, 6, (y / 6) % 2 ? '#3a2818' : '#352416');
          px(0, y + 5, 108, 1, '#22160c');
          for (let x = ((y * 7) % 23); x < 108; x += 23) px(x, y, 1, 5, '#22160c');
        }
        // jack-o'-lanterns on the floor
        for (const [x, y] of [[6, 166], [90, 170]]) {
          px(x, y, 12, 9, '#e67e22');
          px(x + 1, y - 1, 10, 1, '#e67e22');
          px(x + 5, y - 3, 2, 2, '#3d6b2a');
          const glow = Math.sin(t * 8 + x) > 0 ? '#ffd23f' : '#ffb35a';
          px(x + 2, y + 2, 2, 2, glow);
          px(x + 8, y + 2, 2, 2, glow);
          px(x + 3, y + 6, 6, 1, glow);
          px(x, y + 9, 12, 1, 'rgba(0,0,0,0.4)');
        }
        if (dark) {
          r.fillStyle = 'rgba(20, 6, 30, 0.55)';
          r.fillRect(0, 0, 108, 192);
        }
      }

      // ---------- the hero, drawn on a 24x24 stage and scaled up ----------
      const stage = document.createElement('canvas');
      stage.width = 24;
      stage.height = 24;
      const s = stage.getContext('2d');
      function drawHero(t, L) {
        s.clearRect(0, 0, 24, 24);
        s.imageSmoothingEnabled = false;
        drawAura(s, L.aura, 12, 20, 12, t, 'back');
        const img = heroSprite('knight', {}, [], L.look, L.head).normal;
        s.save();
        s.globalAlpha = L.ghost ? 0.82 : 1;
        if (L.flip) {
          s.translate(24, 0);
          s.scale(-1, 1);
        }
        s.drawImage(img, 6, 8, 12, 12);
        s.restore();
        s.globalAlpha = 1;
        drawAura(s, L.aura, 12, 20, 12, t, 'front');
      }

      function caption(text, y) {
        ctx.font = '600 56px Inter';
        ctx.textAlign = 'center';
        ctx.lineJoin = 'round';
        const lines = text.split('\n');
        lines.forEach((line, i) => {
          ctx.lineWidth = 10;
          ctx.strokeStyle = 'rgba(0,0,0,0.55)';
          ctx.strokeText(line, 540, y + i * 70);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(line, 540, y + i * 70);
        });
      }

      function endCard(t) {
        const bg = ctx.createRadialGradient(540, 760, 60, 540, 900, 1200);
        bg.addColorStop(0, '#2a1328');
        bg.addColorStop(1, '#07040b');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, 1080, 1920);
        // the hero in their last costume, small, under the title
        drawHero(t, LOOKS[LOOKS.length - 1]);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(stage, 540 - 12 * 26, 560, 24 * 26, 24 * 26);
        ctx.textAlign = 'center';
        ctx.font = '150px "Pirata One"';
        ctx.shadowColor = 'rgba(210,58,70,0.8)';
        ctx.shadowBlur = 50;
        ctx.fillStyle = '#d23a46';
        ctx.fillText('One More Crypt', 540, 470);
        ctx.shadowBlur = 0;
        ctx.font = '38px Silkscreen';
        ctx.fillStyle = '#e8dcc4';
        ctx.fillText('DRESS YOUR HERO', 540, 1250);
        ctx.fillText('FOR HALLOWEEN', 540, 1305);
        ctx.fillStyle = '#f2c14e';
        ctx.font = '34px Silkscreen';
        ctx.fillText('FREE IN YOUR BROWSER', 540, 1420);
        ctx.fillText('ONEMORECRYPT.COM', 540, 1475);
      }

      window.renderFrame = (i) => {
        const t = i / FPS;
        ctx.imageSmoothingEnabled = false;
        if (t >= END) {
          endCard(t);
          return;
        }
        const L = [...LOOKS].reverse().find((l) => t >= l.at);
        drawRoom(t, Boolean(L.dark));
        // close in on the bed, as if filmed on a phone
        ctx.drawImage(room, -216, -200, 108 * 14, 192 * 14);
        // the hero glances about while waiting, then strikes a pose in each costume
        const look = L.at === 0 ? { ...L, flip: t > 1.3 && t < 2.6 } : L;
        drawHero(t, look);
        const S = look.scale;
        const bob = look.ghost ? Math.sin(t * 3) * 20 : Math.sin(t * 2.2) * 4;
        const feetY = 1590;
        ctx.drawImage(stage, 540 - 12 * S + look.dx, feetY - 20 * S + look.dy + bob, 24 * S, 24 * S);
        // a soft light on the hero, and the room's corners in shadow
        const v = ctx.createRadialGradient(540, 1200, 300, 540, 1100, 1250);
        v.addColorStop(0, 'rgba(0,0,0,0)');
        v.addColorStop(1, look.dark ? 'rgba(5,0,10,0.75)' : 'rgba(5,0,10,0.5)');
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, 1080, 1920);
        if (t < LOOKS[1].at) caption("sorry I'm late, my hero was\ntrying on Halloween costumes", 250);
      };
      window.frameCount = Math.round(LENGTH * FPS);
      window.ready = true;
    </script>
  </body>
</html>

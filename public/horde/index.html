    <script>
      // Straight into the game, opening this mode. Any tags on this link come along, and so
      // does the site that linked here (as "via"), which the game would otherwise see as us.
      (function () {
        var q = new URLSearchParams(location.search);
        q.set('play', 'horde');
        try {
          var from = document.referrer ? new URL(document.referrer).hostname : '';
          if (from && from !== location.hostname && !q.has('ref') && !q.has('via')) q.set('via', from);
        } catch (e) {}
        location.replace('../?' + q.toString() + location.hash);
      })();
    </script>

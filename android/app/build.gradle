// One More Crypt for Android: a single full-screen WebView that plays onemorecrypt.com.
// Build: ./gradlew bundleRelease assembleRelease, then sign with the upload key (see README.md).
apply plugin: 'com.android.application'

android {
    namespace 'com.onemorecrypt.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.onemorecrypt.app'
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

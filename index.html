    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Pixelify+Sans:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet" />
    <script>
      // Each new version of the game gets new file names. Opened in the moment one goes live,
      // a page can miss its own stylesheet or code and show up bare. Reload once to fetch them
      // fresh (never in a loop: a second failure in this tab is left alone).
      (function () {
        var KEY = 'omc:heal';
        function heal() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {
            return;
          }
          location.reload();
        }
        // Our own stylesheet or script failing to load (not the web fonts, which can be blocked).
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'LINK' && t.tagName !== 'SCRIPT')) return;
          var url = t.href || t.src || '';
          if (url.indexOf(location.origin) === 0) heal();
        }, true);
        // Or the styles simply never arrived.
        window.addEventListener('load', function () {
          if (!getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()) heal();
          else try { sessionStorage.removeItem(KEY); } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="ghosts" aria-hidden="true"></div>
    <div id="app">
      <header id="hud">
        <div class="hp">
          <div class="hp-bar"><div class="hp-ghost" id="hp-ghost"></div><div class="hp-fill" id="hp-fill"></div></div>
          <span id="hp-text">10/10</span>
        </div>
        <div class="stats">
          <span id="floor-stat" title="Floor"><i id="floor-icon"><i class="pxi pxi-stairs" aria-hidden="true"></i></i> <b id="floor">1</b></span>
          <span id="atk-stat" title="Attack"><i><i class="pxi pxi-sword" aria-hidden="true"></i></i> <b id="atk">1</b></span>
          <span id="kills-stat" title="Kills"><i><i class="pxi pxi-bones" aria-hidden="true"></i></i> <b id="kills">0</b></span>
        </div>
        <div class="hud-buttons">
          <button id="mute" class="icon-btn" aria-label="Toggle sound"><i class="pxi pxi-sound" aria-hidden="true"></i></button>
          <button id="menu-btn" class="icon-btn" aria-label="Menu"><i class="pxi pxi-menu" aria-hidden="true"></i></button>
        </div>
      </header>

      <div id="surge-bar" hidden aria-label="Kills until your next relic">
        <div class="surge-track"><div id="surge-fill"></div></div>
        <span id="surge-label"></span>
      </div>

      <div id="boss-bar" hidden>
        <span id="boss-name">The Bone Warden</span>
        <div class="boss-track"><div id="boss-fill"></div></div>
      </div>

      <aside id="foes" hidden aria-label="Foes on this floor"></aside>

      <main id="stage">
        <canvas id="board"></canvas>
      </main>

      <div id="relic-bar" aria-label="Your relics"></div>
      <div id="coach" hidden>
        <div class="coach-head"><span id="coach-step"></span><button id="coach-skip" class="link-btn">Skip tutorial</button></div>
        <p id="coach-text"></p>
      </div>
      <p id="tip">Bump into foes to strike. Clear the floor to unseal the stairs.</p>
      <button id="wait-btn" class="wait-btn" aria-label="Wait a turn">⏳ Wait a turn <kbd>Space</kbd></button>
      <button id="bow-btn" class="wait-btn bow-btn" hidden aria-label="Raise or lower the bow">🏹 Bow: ready <kbd>B</kbd></button>

      <div id="dpad">
        <button data-dir="0,-1" aria-label="Up">▲</button>
        <button data-dir="-1,0" aria-label="Left">◀</button>
        <button data-dir="0,0" aria-label="Wait" class="wait">WAIT</button>
        <button data-dir="1,0" aria-label="Right">▶</button>
        <button data-dir="0,1" aria-label="Down">▼</button>
        <button id="bow-pad" class="bow-pad" hidden aria-label="Raise or lower the bow">🏹<small>READY</small></button>
      </div>
    </div>

    <div id="overlay" hidden></div>
    <div id="toast" hidden></div>
    <div id="feat" hidden></div>
    <!-- Sites the game is listed on, linking back (shown under the title's links; the portal builds drop it). -->
    <div id="listing-badges" hidden>
<a href="https://pixelpicked.com/game/19kYrJpUKUy/one-more-crypt" target="_blank" rel="noopener">
<img src="https://api.pixelpicked.com/api/badges/19kYrJpUKUy/live.png?theme=dark"
    width="250" height="54" alt="Approved on PixelPicked" />
</a>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
